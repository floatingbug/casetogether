openapi: 3.1.0
info:
  title: CaseTogether API
  version: 0.1.0
  description: Vorläufiger Vertrag – vor Implementierung vervollständigen.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: Service erreichbar
  /rooms:
    post:
      operationId: createRoom
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Raum erstellt
        "401":
          description: Nicht authentifiziert
  /rooms/join:
    post:
      operationId: joinRoom
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Raum beigetreten
        "400":
          description: Ungültiger Einladungscode
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
